name: CABAL Quiz V5 - Deploy STAGING

on:
  push:
    branches:
      - quiz-v5-worker-d1
    paths:
      - '.github/workflows/quiz-worker-staging.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_STAGING to deploy the isolated staging Worker'
        required: true
        type: string
      initialize_schema:
        description: 'Create missing SQL tables in staging D1 (never production)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cabal-quiz-v5-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ github.ref == 'refs/heads/quiz-v5-worker-d1' && (github.event_name == 'push' || inputs.confirmation == 'DEPLOY_STAGING') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Enforce isolation before any Cloudflare command
        run: |
          grep -Fxq 'name = "cabal-quiz-api-staging"' wrangler.staging.toml
          grep -Fxq 'database_name = "cabal-ranking-quiz-v5-staging"' wrangler.staging.toml
          grep -Fxq 'database_id = "b99cfc80-f420-4c7c-bf6d-7e03839d46a5"' wrangler.staging.toml
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Assemble isolated public Quiz frontend
        run: |
          mkdir -p public-staging/quiz public-staging/quiz-manager
          cp ../quiz/index.html public-staging/quiz/index.html
          cp ../quiz/play.js public-staging/quiz/play.js
          cp ../quiz/leaderboard.js public-staging/quiz/leaderboard.js
          cp ../quiz-manager/index.html public-staging/quiz-manager/index.html
          cp ../quiz-manager/rules-ui.js public-staging/quiz-manager/rules-ui.js
          cp ../quiz-manager/ranking-ui.js public-staging/quiz-manager/ranking-ui.js
          cp ../quiz-manager/timers-ui.js public-staging/quiz-manager/timers-ui.js
          cp ../quiz.css public-staging/quiz.css
          cp ../quiz.js public-staging/quiz.js
          cp ../ranking_data.js public-staging/ranking_data.js
          cp ../index.html public-staging/index.html
          cp -R ../assets public-staging/assets
          cp ../favicon.ico public-staging/favicon.ico
          printf "window.CABAL_QUIZ_API_BASE='';\\nwindow.CABAL_QUIZ_PLAY_BASE='/quiz/';\\n" > public-staging/quiz-config.js
          test -s public-staging/quiz/index.html
          test -s public-staging/quiz/play.js
      - name: Validate Worker JavaScript
        run: |
          node --check src/index.js
          node --check ../quiz/play.js
          node --check src/admin.js
          node --check src/admin-records.js
          node --check src/admin-timers.js
          node --check ../quiz-manager/timers-ui.js
          node --check src/rules.js
          node --check src/admin-rules.js
          node --check ../quiz-manager/rules-ui.js
          node --check ../quiz-manager/ranking-ui.js
          node --check ../quiz/play.js
          node --check ../quiz.js
      - name: Validate staging bundle (no deploy)
        run: npx wrangler deploy --config wrangler.staging.toml --dry-run --outdir .wrangler-staging-preview
      - name: Initialize staging D1 schema (optional)
        if: ${{ github.event_name == 'push' || inputs.initialize_schema }}
        run: npx wrangler d1 execute cabal-ranking-quiz-v5-staging --config wrangler.staging.toml --remote --file ./schema.sql --yes
      - name: Initialize STAGING Admin Audit (safe to re-run)
        run: npx wrangler d1 execute cabal-ranking-quiz-v5-staging --config wrangler.staging.toml --remote --file ./admin-schema.sql --yes
      - name: Initialize STAGING Rules Config and History
        run: npx wrangler d1 execute cabal-ranking-quiz-v5-staging --config wrangler.staging.toml --remote --file ./rules-schema.sql --yes
      - name: Initialize private email storage in STAGING D1
        run: npx wrangler d1 execute cabal-ranking-quiz-v5-staging --config wrangler.staging.toml --remote --file ./private-email-schema.sql --yes
      - name: Initialize STAGING per-question timer tracking
        run: npx wrangler d1 execute cabal-ranking-quiz-v5-staging --config wrangler.staging.toml --remote --file ./timer-schema.sql --yes
      - name: Initialize STAGING timer settings and ranking archive
        run: npx wrangler d1 execute cabal-ranking-quiz-v5-staging --config wrangler.staging.toml --remote --file ./manager-controls-schema.sql --yes
      - name: Deploy staging Worker only
        run: npx wrangler deploy --config wrangler.staging.toml
      - name: Smoke test timed quiz and IGN lookup without ranking writes
        run: node ./scripts/verify-record-status.mjs
      - name: Show staging health URL
        run: echo "Visit https://cabal-quiz-api-staging.<your-workers-subdomain>.workers.dev/api/quiz/health"

# The push trigger is limited to edits to THIS workflow on quiz-v5-worker-d1.
# Regular worker commits do not deploy automatically; future manual runs require confirmation.

