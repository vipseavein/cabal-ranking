name: Cloudflare D1 Read-Only Diagnostics

on:
  push:
    branches:
      - quiz-v5-worker-d1
    paths:
      - '.github/workflows/d1-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics-only:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler (no deployment)
        run: npm install --no-audit --no-fund
      - name: Query account, staging, production D1 insights (analytics only)
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Cloudflare account credentials unavailable; no diagnostic query attempted."
            exit 0
          fi
          set +e
          npx wrangler d1 insights --sort-type=sum --sort-by=reads --limit=20 --time-period=1d --json > account-insights.json 2> account-insights.err
          account_code=$?
          npx wrangler d1 insights cabal-ranking-quiz-v5-staging --sort-type=sum --sort-by=reads --limit=20 --time-period=1d --json > staging-insights.json 2> staging-insights.err
          staging_code=$?
          npx wrangler d1 insights cabal-ranking-quiz-v5 --sort-type=sum --sort-by=reads --limit=20 --time-period=1d --json > production-insights.json 2> production-insights.err
          production_code=$?
          set -e
          for mode in account staging production; do
            if [[ "$mode" == "account" ]]; then code="$account_code"; elif [[ "$mode" == "staging" ]]; then code="$staging_code"; else code="$production_code"; fi
            echo "DIAGNOSTIC $mode exit_code=$code"
            if [[ "$code" == 0 ]]; then
              node scripts/print-d1-diagnostics.mjs "$mode-insights.json" "$mode"
            else
              echo "Insufficient analytics permission or Wrangler analytics error. No raw error text or secrets logged."
              grep -Eio '(account analytics read|permission|forbidden|unauthorized|authentication|not authorized|requires|unknown option|not found|access denied)' "$mode-insights.err" | sort -u | head -8 || true
            fi
          done
